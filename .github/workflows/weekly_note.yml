name: Weekly Note Draft

on:
  schedule:
    - cron: "15 15 * * 0"   # 毎週月曜 9:15 JST着地を狙う(実際の発火が9時間遅れる事象を踏まえ、設定を9時間前倒し。UTC上は日曜15:15)
  workflow_dispatch: {}

permissions:
  contents: write   # テーマ履歴(themes_log.json)をリポジトリにコミットするために必要

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r automation/requirements.txt
      - run: python automation/weekly_note.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Commit updated theme history
        run: |
          git config user.name "note-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add automation/themes_log.json
          git diff --staged --quiet || git commit -m "Update themes_log.json"
          git fetch origin main
          git rebase origin/main
          git push
